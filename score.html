<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Volley MGN - Scoreboard FIXED</title>
    <style>
        body { margin: 0; padding: 20px; font-family: 'Segoe UI', Arial, sans-serif; background: transparent; display: flex; justify-content: center; user-select: none; }
        .scoreboard { 
            display: flex; align-items: center; background: rgba(30, 30, 30, 0.98); 
            border-bottom: 4px solid #ffcc00; color: white; padding: 10px 30px; 
            border-radius: 15px; box-shadow: 0 15px 40px rgba(0,0,0,0.8); 
            min-width: 900px; min-height: 110px; 
        }
        .team { display: flex; align-items: center; flex: 1; gap: 15px; }
        .names-container { display: flex; flex-direction: column; width: 100%; max-width: 350px; line-height: 1.2; }
        .team-name { font-size: 20px; font-weight: 800; text-transform: uppercase; color: white; background: rgba(255,255,255,0.05); padding: 2px 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .sets { background: #333; padding: 8px 18px; border-radius: 8px; font-size: 28px; font-weight: 800; color: #ffcc00; min-width: 35px; text-align: center; cursor: pointer; }
        .points { font-size: 68px; font-weight: 900; width: 110px; text-align: center; background: #eee; color: #111; margin: 0 15px; border-radius: 8px; cursor: pointer; }
        .pop { animation: popAnim 0.2s ease-out; }
        @keyframes popAnim { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .divider { font-size: 40px; font-weight: bold; color: #444; }
    </style>
</head>
<body>
<div class="scoreboard">
    <div class="team" style="justify-content: flex-end; text-align: right;">
        <div class="names-container">
            <div class="team-name" id="t1p1" contenteditable="true">КОМАНДА А</div>
            <div class="team-name" id="t1p2" contenteditable="true"></div>
        </div>
        <div class="sets" id="sets1" onclick="changeV('setsA', 1)" oncontextmenu="changeV('setsA', -1); return false;">0</div>
    </div>
    <div class="points" id="pts1" onclick="changeV('ptsA', 1)" oncontextmenu="changeV('ptsA', -1); return false;">0</div>
    <div class="divider">:</div>
    <div class="points" id="pts2" onclick="changeV('ptsB', 1)" oncontextmenu="changeV('ptsB', -1); return false;">0</div>
    <div class="team">
        <div class="sets" id="sets2" onclick="changeV('setsB', 1)" oncontextmenu="changeV('setsB', -1); return false;">0</div>
        <div class="names-container" style="text-align: left;">
            <div class="team-name" id="t2p1" contenteditable="true">КОМАНДА Б</div>
            <div class="team-name" id="t2p2" contenteditable="true"></div>
        </div>
    </div>
</div>

<script>
    // ВСТАВЬ СВОЙ КЛЮЧ
    const API_KEY = "$2a$10$/UoMSo.IHG9Ssn7UvReGie74mZa8ExFNAbIr8rBfOE.mg8uJk.vbS";
    const BIN_URL = "https://api.jsonbin.io";

    // Функция синхронизации (загрузки данных)
    async function sync() {
        try {
            const res = await fetch(BIN_URL + "/latest?meta=false", { 
                headers: { "X-Master-Key": API_KEY } 
            });
            const data = await res.json();
            const live = data.live;
            if (!live) return;

            updateUI('pts1', live.ptsA);
            updateUI('pts2', live.ptsB);
            updateUI('sets1', live.setsA);
            updateUI('sets2', live.setsB);
            
            if (document.activeElement.tagName !== 'DIV') {
                const nA = String(live.teamA).split('/');
                document.getElementById('t1p1').innerText = nA[0] || "А";
                document.getElementById('t1p2').innerText = nA[1] || "";
                const nB = String(live.teamB).split('/');
                document.getElementById('t2p1').innerText = nB[0] || "Б";
                document.getElementById('t2p2').innerText = nB[1] || "";
            }
        } catch (e) { console.error("Ошибка синхронизации:", e); }
    }

    // Функция изменения (нажатия на табло)
    async function changeV(key, d) {
        try {
            const res = await fetch(BIN_URL + "/latest?meta=false", { 
                headers: { "X-Master-Key": API_KEY } 
            });
            let data = await res.json();
            
            data.live[key] = Math.max(0, (data.live[key] || 0) + d);
            if (key.includes('sets') && d > 0) { data.live.ptsA = 0; data.live.ptsB = 0; }
            
            await fetch(BIN_URL, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify(data)
            });
            sync(); // Сразу обновляем экран
        } catch (e) { console.error("Ошибка обновления:", e); }
    }

    function updateUI(id, val) {
        const el = document.getElementById(id);
        if (el && el.innerText != val) {
            el.innerText = val;
            el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
        }
    }

    document.addEventListener('contextmenu', e => { 
        if(e.target.id.includes('pts') || e.target.id.includes('sets')) e.preventDefault(); 
    });

    setInterval(sync, 3000); // Раз в 3 сек для стабильности
    sync();
</script>
</body>
</html>
