<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Volleyball Scoreboard - LIVE SYNC</title>
    <style>
        /* ТВОЙ ОРИГИНАЛЬНЫЙ СТИЛЬ */
        body { margin: 0; padding: 20px; font-family: 'Segoe UI', Arial, sans-serif; background: transparent; display: flex; justify-content: center; user-select: none; }
        .scoreboard { 
            display: flex; align-items: center; background: rgba(30, 30, 30, 0.98); 
            border-bottom: 4px solid #ffcc00; color: white; padding: 10px 30px; 
            border-radius: 15px; box-shadow: 0 15px 40px rgba(0,0,0,0.8); 
            min-width: 900px; min-height: 110px; 
        }
        .team { display: flex; align-items: center; flex: 1; gap: 15px; }
        .names-container { display: flex; flex-direction: column; width: 100%; max-width: 350px; line-height: 1.2; }
        .team-name { 
            font-size: 20px; font-weight: 800; text-transform: uppercase; 
            color: white; background: rgba(255,255,255,0.05); 
            border: 1px dashed transparent; padding: 2px 8px; 
            cursor: text; outline: none; transition: 0.2s;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .team-name:focus { border-color: #ffcc00; background: rgba(255,255,255,0.15); }
        .jersey-color { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #666; }
        .sets { background: #333; padding: 8px 18px; border-radius: 8px; font-size: 28px; font-weight: 800; color: #ffcc00; min-width: 35px; text-align: center; }
        .points { font-size: 68px; font-weight: 900; width: 110px; text-align: center; background: #eee; color: #111; margin: 0 15px; border-radius: 8px; }
        .pop { animation: popAnim 0.2s ease-out; }
        @keyframes popAnim { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .divider { font-size: 40px; font-weight: bold; color: #444; }
    </style>
</head>
<body>

<div class="scoreboard">
    <div class="team" style="justify-content: flex-end; text-align: right;">
        <div class="names-container">
            <div class="team-name" id="t1p1" contenteditable="true">ИГРОК 1</div>
            <div class="team-name" id="t1p2" contenteditable="true">ИГРОК 2</div>
        </div>
        <div class="jersey-color" id="view1" style="background:#fff"></div>
        <div class="sets" id="sets1">0</div>
    </div>

    <div class="points" id="pts1">0</div>
    <div class="divider">:</div>
    <div class="points" id="pts2">0</div>

    <div class="team">
        <div class="sets" id="sets2">0</div>
        <div class="jersey-color" id="view2" style="background:#04f"></div>
        <div class="names-container" style="text-align: left;">
            <div class="team-name" id="t2p1" contenteditable="true">ИГРОК 3</div>
            <div class="team-name" id="t2p2" contenteditable="true">ИГРОК 4</div>
        </div>
    </div>
</div>

<script>
    const DB_URL = "https://volleyscoremgn-default-rtdb.firebaseio.com";

    async function sync() {
        try {
            const res = await fetch(DB_URL);
            const data = await res.json();
            if (!data) return;

            // Функция обновления с анимацией
            const up = (id, val) => {
                const el = document.getElementById(id);
                if (el && el.innerText != val) {
                    el.innerText = val;
                    el.classList.remove('pop');
                    void el.offsetWidth;
                    el.classList.add('pop');
                }
            };

            // Синхронизируем цифры
            up('pts1', data.ptsA || 0);
            up('pts2', data.ptsB || 0);
            up('sets1', data.setsA || 0);
            up('sets2', data.setsB || 0);

            // Синхронизируем имена ТОЛЬКО если они изменились в базе (из админки)
            // Чтобы не перебивать твой ручной ввод в OBS
            if (data.teamA && !document.activeElement.classList.contains('team-name')) {
                const namesA = data.teamA.split('/');
                if(namesA[0]) document.getElementById('t1p1').innerText = namesA[0].trim();
                if(namesA[1]) document.getElementById('t1p2').innerText = namesA[1].trim();
            }
            if (data.teamB && !document.activeElement.classList.contains('team-name')) {
                const namesB = data.teamB.split('/');
                if(namesB[0]) document.getElementById('t2p1').innerText = namesB[0].trim();
                if(namesB[1]) document.getElementById('t2p2').innerText = namesB[1].trim();
            }

        } catch (e) { console.error("Firebase Error:", e); }
    }

    // Запрет Enter в именах
    document.querySelectorAll('.team-name').forEach(el => {
        el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); el.blur(); } });
    });

    setInterval(sync, 1000);
    sync();
</script>
</body>
</html>
