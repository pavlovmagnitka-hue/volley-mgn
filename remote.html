<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Remote MGN - JSONbin</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 10px; touch-action: manipulation; }
        .info { background: #333; padding: 15px; border-radius: 10px; margin-bottom: 15px; border-bottom: 4px solid #fc0; font-weight: bold; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .score { font-size: 80px; font-weight: 900; margin: 5px 0; }
        .sets { font-size: 24px; color: #fc0; background: #222; padding: 5px 15px; border-radius: 5px; }
        .btn-p { width: 100%; height: 100px; font-size: 50px; background: #28a745; color: white; border: none; border-radius: 12px; }
        .btn-m { width: 100%; height: 40px; background: #dc3545; color: white; border: none; border-radius: 8px; margin-top: 5px; }
    </style>
</head>
<body>
<div class="info"><span id="nA">Загрузка...</span> vs <span id="nB">...</span></div>
<div class="grid">
    <div>
        <div class="sets" id="sA">0</div>
        <div class="score" id="pA">0</div>
        <button class="btn-p" onclick="mod('ptsA', 1)">+</button>
        <button class="btn-m" onclick="mod('ptsA', -1)">-1</button>
        <button class="btn-m" style="background:#888" onclick="mod('setsA', 1)">СЕТ +</button>
    </div>
    <div>
        <div class="sets" id="sB">0</div>
        <div class="score" id="pB">0</div>
        <button class="btn-p" onclick="mod('ptsB', 1)">+</button>
        <button class="btn-m" onclick="mod('ptsB', -1)">-1</button>
        <button class="btn-m" style="background:#888" onclick="mod('setsB', 1)">СЕТ +</button>
    </div>
</div>

<script>
    const BIN_ID = "699d793843b1c97be9992f8e";
    const API_KEY = "$2a$10$/UoMSo.IHG9Ssn7UvReGie74mZa8ExFNAbIr8rBfOE.mg8uJk.vbS";
    const URL = "https://api.jsonbin.io" + BIN_ID;

    async function mod(key, d) {
        try {
            const res = await fetch(URL + "/latest?meta=false", { headers: { "X-Master-Key": API_KEY } });
            let data = await res.json();
            data.live[key] = Math.max(0, (data.live[key] || 0) + d);
            if (key.includes('sets') && d > 0) { data.live.ptsA = 0; data.live.ptsB = 0; }
            
            await fetch(URL, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify(data)
            });
            render(data.live);
        } catch (e) { console.error("Ошибка"); }
    }

    function render(live) {
        document.getElementById('pA').innerText = live.ptsA;
        document.getElementById('pB').innerText = live.ptsB;
        document.getElementById('sA').innerText = live.setsA;
        document.getElementById('sB').innerText = live.setsB;
        document.getElementById('nA').innerText = live.teamA.split('/')[0];
        document.getElementById('nB').innerText = live.teamB.split('/')[0];
    }
    
    // Начальная загрузка
    fetch(URL + "/latest?meta=false", { headers: { "X-Master-Key": API_KEY } })
        .then(r => r.json()).then(d => render(d.live));
</script>
</body>
</html>
