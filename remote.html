<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Volley MGN - Remote</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 10px; touch-action: manipulation; }
        .info { background: #333; padding: 15px; border-radius: 10px; margin-bottom: 15px; border-bottom: 4px solid #fc0; font-weight: bold; min-height: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .score { font-size: 80px; font-weight: 900; margin: 5px 0; line-height: 1; }
        .sets { font-size: 24px; color: #fc0; background: #222; padding: 5px 15px; border-radius: 5px; display: inline-block; }
        .btn-p { width: 100%; height: 100px; font-size: 50px; background: #28a745; color: white; border: none; border-radius: 12px; cursor: pointer; box-shadow: 0 4px #1e7e34; }
        .btn-p:active { transform: translateY(2px); box-shadow: none; }
        .btn-m { width: 100%; height: 45px; background: #dc3545; color: white; border: none; border-radius: 8px; margin-top: 10px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="info"><span id="nA">ОЖИДАНИЕ...</span> vs <span id="nB">...</span></div>

<div class="grid">
    <div>
        <div class="sets" id="sA">0</div>
        <div class="score" id="pA">0</div>
        <button class="btn-p" onclick="mod('ptsA', 1)">+</button>
        <button class="btn-m" onclick="mod('ptsA', -1)">-1</button>
        <button class="btn-m" style="background:#666" onclick="mod('setsA', 1)">СЕТ +</button>
    </div>
    <div>
        <div class="sets" id="sB">0</div>
        <div class="score" id="pB">0</div>
        <button class="btn-p" onclick="mod('ptsB', 1)">+</button>
        <button class="btn-m" onclick="mod('ptsB', -1)">-1</button>
        <button class="btn-m" style="background:#666" onclick="mod('setsB', 1)">СЕТ +</button>
    </div>
</div>

<script>
    // ВСТАВЬ СЮДА MASTER KEY
    const KEY = "$2a$10$/UoMSo.IHG9Ssn7UvReGie74mZa8ExFNAbIr8rBfOE.mg8uJk.vbS";

    // Функция модификации (Скачать -> Изменить -> Закачать)
    async function mod(key, d) {
        try {
            const res = await fetch("https://api.jsonbin.io", {
                headers: { "X-Master-Key": KEY }
            });
            if (!res.ok) throw new Error("Ошибка загрузки");
            let data = await res.json();

            // Математика
            data.live[key] = Math.max(0, (data.live[key] || 0) + d);
            if (key.includes('sets') && d > 0) {
                data.live.ptsA = 0;
                data.live.ptsB = 0;
            }

            // Отправка
            const saveRes = await fetch("https://api.jsonbin.io", {
                method: 'PUT',
                headers: { "Content-Type": "application/json", "X-Master-Key": KEY },
                body: JSON.stringify(data)
            });

            if (saveRes.ok) render(data.live);
        } catch (e) {
            console.error(e);
            alert("Сбой связи: " + e.message);
        }
    }

    function render(live) {
        if (!live) return;
        document.getElementById('pA').innerText = live.ptsA || 0;
        document.getElementById('pB').innerText = live.ptsB || 0;
        document.getElementById('sA').innerText = live.setsA || 0;
        document.getElementById('sB').innerText = live.setsB || 0;
        document.getElementById('nA').innerText = live.teamA || "А";
        document.getElementById('nB').innerText = live.teamB || "Б";
    }

    // Загрузка при старте
    fetch("https://api.jsonbin.io", {
        headers: { "X-Master-Key": KEY }
    })
    .then(r => r.json())
    .then(d => { if(d.live) render(d.live); })
    .catch(e => console.error("Ошибка инициализации:", e));
</script>
</body>
</html>
