<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Admin Volley MGN - FIXED</title>
    <!-- Подключаем Firebase SDK (надежнее чем fetch) -->
    <script src="https://www.gstatic.com"></script>
    <script src="https://www.gstatic.com"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #eef2f7; padding: 20px; }
        .box { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; max-width: 600px; margin: auto; }
        textarea { width: 100%; height: 100px; margin-bottom: 10px; box-sizing: border-box; }
        button { padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .btn-live { background: #28a745; font-size: 12px; }
    </style>
</head>
<body>

<div class="box">
    <h2>1. Создать расписание</h2>
    <textarea id="tList" placeholder="Команды (каждая с новой строки)"></textarea>
    <button onclick="makeTours()">Генерировать и сохранить</button>
    <div id="st" style="margin-top:10px; font-weight:bold; color:blue;"></div>
</div>

<div class="box">
    <h2>2. Список матчей</h2>
    <div id="sched">Загрузка...</div>
</div>

<script>
    // КОНФИГУРАЦИЯ (Проверь правильность URL)
    const firebaseConfig = {
        databaseURL: "https://volleyscoremgn-default-rtdb.firebaseio.com"
    };
    
    // Инициализация
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    async function makeTours() {
        const teams = document.getElementById('tList').value.split('\n').map(t => t.trim()).filter(t => t !== "");
        if (teams.length < 2) return alert("Нужно 2+ команды");

        if (teams.length % 2 !== 0) teams.push("ВЫХОДНОЙ");
        let schedule = [];
        let temp = [...teams];
        for (let r = 0; r < temp.length - 1; r++) {
            for (let i = 0; i < temp.length / 2; i++) {
                let tA = temp[i], tB = temp[temp.length - 1 - i];
                if (tA !== "ВЫХОДНОЙ" && tB !== "ВЫХОДНОЙ") schedule.push({ tour: r+1, teamA: tA, teamB: tB });
            }
            temp.splice(1, 0, temp.pop());
        }

        document.getElementById('st').innerText = "⏳ Сохранение...";
        
        // Прямая запись через SDK (решает проблему с .json и CORS)
        db.ref('tournament').set({ schedule, updatedAt: Date.now() })
            .then(() => {
                document.getElementById('st').innerText = "✅ Готово!";
                loadSched();
            })
            .catch(e => {
                document.getElementById('st').innerText = "❌ Ошибка: " + e.message;
            });
    }

    function loadSched() {
        db.ref('tournament/schedule').on('value', (snap) => {
            const data = snap.val();
            if (!data) { document.getElementById('sched').innerText = "Пусто"; return; }
            
            let html = '<table><tr><th>Тур</th><th>Матч</th><th>Эфир</th></tr>';
            data.forEach((m) => {
                html += `<tr>
                    <td>${m.tour}</td>
                    <td>${m.teamA} - ${m.teamB}</td>
                    <td><button class="btn-live" onclick="setLive('${m.teamA}','${m.teamB}')">В ЭФИР</button></td>
                </tr>`;
            });
            document.getElementById('sched').innerHTML = html + '</table>';
        });
    }

    function setLive(a, b) {
        db.ref('live').set({
            teamA: a, teamB: b,
            ptsA: 0, ptsB: 0, setsA: 0, setsB: 0,
            timeout: false, sideSwap: false
        }).then(() => alert("Матч запущен!"));
    }

    loadSched();
</script>
</body>
</html>
