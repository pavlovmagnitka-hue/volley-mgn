<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Admin Volley MGN - JSONbin Edition</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #eef2f7; padding: 20px; }
        .box { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; max-width: 600px; margin: auto; }
        textarea { width: 100%; height: 100px; margin-bottom: 10px; box-sizing: border-box; }
        button { padding: 12px 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #fff; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        .btn-live { background: #28a745; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px; }
        .status { margin-top: 10px; font-weight: bold; color: #007bff; }
    </style>
</head>
<body>

<div class="box">
    <h2>1. Жеребьевка (JSONbin)</h2>
    <textarea id="tList" placeholder="Команды (каждая с новой строки)..."></textarea>
    <button onclick="makeTours()">Создать расписание</button>
    <div id="st" class="status">Готов</div>
</div>

<div class="box">
    <h2>2. Список матчей</h2>
    <div id="sched">Загрузка...</div>
</div>

<script>
  // Вставь сюда ID (только буквы и цифры, например: 67bc6689e41b4d3414995965)
const BIN_ID = "699d793843b1c97be9992f8e"; 
// Вставь сюда Master Key (длинный, начинается на $2b$10$)
const API_KEY = "$2a$10$/UoMSo.IHG9Ssn7UvReGie74mZa8ExFNAbIr8rBfOE.mg8uJk.vbS""; 
// ПРАВИЛЬНАЯ ССЫЛКА (с косой чертой перед ID)
const URL = "https://api.jsonbin.io" + BIN_ID;
    async function makeTours() {
        const st = document.getElementById('st');
        const teams = document.getElementById('tList').value.split('\n').map(t => t.trim()).filter(t => t !== "");
        if (teams.length < 2) return alert("Нужно 2+ команды");

        if (teams.length % 2 !== 0) teams.push("ВЫХОДНОЙ");
        let schedule = [];
        let temp = [...teams];
        for (let r = 0; r < temp.length - 1; r++) {
            for (let i = 0; i < temp.length / 2; i++) {
                let tA = temp[i], tB = temp[temp.length - 1 - i];
                if (tA !== "ВЫХОДНОЙ" && tB !== "ВЫХОДНОЙ") schedule.push({ tour: r + 1, teamA: tA, teamB: tB });
            }
            temp.splice(1, 0, temp.pop());
        }

        st.innerText = "⏳ Сохранение в облако...";
        
        try {
            // Чтобы обновить бин, нужно сначала получить текущие данные или отправить новые
            const res = await fetch(URL, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': API_KEY
                },
                body: JSON.stringify({ 
                    tournament: { schedule, updatedAt: Date.now() },
                    live: { teamA: "...", teamB: "...", ptsA: 0, ptsB: 0, setsA: 0, setsB: 0 }
                })
            });

            if (res.ok) {
                st.innerText = "✅ Расписание сохранено!";
                loadSched();
            }
        } catch (e) { st.innerText = "❌ Ошибка: " + e.message; }
    }

    async function loadSched() {
        try {
            const res = await fetch(URL, { headers: { 'X-Master-Key': API_KEY } });
            const result = await res.json();
            const data = result.record; // В JSONbin данные лежат в поле record
            
            const schedDiv = document.getElementById('sched');
            if (!data.tournament.schedule) { schedDiv.innerText = "Пусто"; return; }

            let h = '<table><tr><th>Тур</th><th>Матч</th><th>Эфир</th></tr>';
            data.tournament.schedule.forEach(m => {
                h += `<tr><td>${m.tour}</td><td>${m.teamA} - ${m.teamB}</td>
                <td><button class="btn-live" onclick="setLive('${m.teamA}','${m.teamB}')">В ЭФИР</button></td></tr>`;
            });
            schedDiv.innerHTML = h + '</table>';
        } catch (e) { console.error(e); }
    }

    async function setLive(a, b) {
        try {
            // 1. Сначала читаем текущий бин, чтобы не стереть турнирную сетку
            const getRes = await fetch(URL, { headers: { 'X-Master-Key': API_KEY } });
            const current = await getRes.json();
            const data = current.record;

            // 2. Обновляем только блок live
            data.live = { teamA: a, teamB: b, ptsA: 0, ptsB: 0, setsA: 0, setsB: 0, timeout: false, sideSwap: false };

            // 3. Сохраняем всё обратно
            await fetch(URL, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify(data)
            });
            alert("Матч запущен!");
        } catch (e) { alert("Ошибка: " + e.message); }
    }

    loadSched();
</script>
</body>
</html>
